<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->

        <title>Example Lesson1: Registration Form</title>

        <!-- Bootstrap core CSS -->        
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
		
		<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap-theme.min.css">

        <!-- Adding some custom style to page -->
        <style type="text/css">
            form { max-width: 600px; }
            .main-label { font-size: 16px; }
        </style>

        <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
        <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
        <!--[if lt IE 9]>
          <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
          <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
        <![endif]-->
    </head>
    <body>

      <div class="container">
        <div class="page-header">
			<h1>Example2: Students Registration Form</h1>
		</div>

        <!-- action: URL of the servlet that receives the form data.
             method="POST": send data in the HTTP request body (not in the URL query string).
             The relative URL assumes this HTML file is in the web application's root. -->
        <form action="servlet/RegisterExample2" method="POST" class="form-horizontal">
          
          <!-- The input's name="firstname" becomes the request parameter
               read by request.getParameter("firstname") in the servlet.
               The id connects the input to its label (label for="name"). -->
          <div class="form-group">
            <label for="name" class="col-sm-3 control-label main-label">First name: </label>
            <div class="col-sm-9">
              <input type="text" name="firstname" id="name" class="form-control" placeholder="please enter your first name">
            </div>
          </div>

          <!-- The servlet reads this field with getParameter("lastname"). -->
          <div class="form-group">
            <label for="surname" class="col-sm-3 control-label main-label">Last name: </label>
            <div class="col-sm-9">
              <input type="text" name="lastname" id="surname" class="form-control" placeholder="please enter your last name">
            </div>
          </div>

          <!-- AM: student registration number. Sent as a String parameter,
               even if the user enters only digits. -->
          <div class="form-group">
            <label for="am" class="col-sm-3 control-label main-label">AM: </label>
            <div class="col-sm-9">
              <input type="text" name="am" id="am" class="form-control" placeholder="please enter your registration number">
            </div>
          </div>          
          
          <!-- Submit sends the form to the servlet. Reset restores the initial
               values of the form fields; it does not send a request. -->
          <div class="form-group">
            <div class="col-sm-10 col-sm-offset-2">
              <button type="submit" class="btn btn-success">
                <span class="glyphicon glyphicon-ok"></span> Save
              </button> 
              <button type="reset" class="btn btn-danger">
                <span class="glyphicon glyphicon-remove"></span> Cancel
              </button>              
            </div>
          </div>

        </form>

      </div><!-- /.container -->

      <!-- JavaScript files before the closing body tag -->
      <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
      <script src="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  </body>
</html>
