<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->

        <title>Example Lesson1: Registration Form</title>

        <!-- Bootstrap core CSS -->        
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
		
		<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap-theme.min.css">

        <!-- Adding some custom style to page -->
        <style type="text/css">
            form { max-width: 600px; }
            .main-label { font-size: 16px; }
        </style>

        <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
        <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
        <!--[if lt IE 9]>
          <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
          <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
        <![endif]-->
    </head>
    <body>

      <div class="container">
        <div class="page-header">
			<h1>Example1: Registration Form</h1>
		</div>

        <!-- On submit, the browser sends a GET request to the RegisterExample1 servlet.
             GET form values are added to the URL as query parameters. -->
        <form action="servlet/RegisterExample1" method="GET" class="form-horizontal">
          
          <!-- Text input: name="firstname" is the parameter read by
               request.getParameter("firstname") in the servlet.
               The id connects this input to its label. -->
          <div class="form-group">
            <label for="name" class="col-sm-3 control-label main-label">First name: </label>
            <div class="col-sm-9">
              <input type="text" name="firstname" id="name" class="form-control" placeholder="please enter your name">
            </div>
          </div>

          <!-- The servlet reads this field using request.getParameter("lastname"). -->
          <div class="form-group">
            <label for="surname" class="col-sm-3 control-label main-label">Last name: </label>
            <div class="col-sm-9">
              <input type="text" name="lastname" id="surname" class="form-control" placeholder="please enter your surname">
            </div>
          </div>

          <!-- Even though this represents a number, the servlet receives a String. -->
          <div class="form-group">
            <label for="age" class="col-sm-3 control-label main-label">Age: </label>
            <div class="col-sm-9">
              <input type="text" name="age" id="age" class="form-control" placeholder="please enter your age">
            </div>
          </div>

          <!-- A select sends the value of the selected option.
               The empty first value means that no country has been chosen. -->
          <div class="form-group">
						<label for="ccountry" class="col-sm-3 control-label main-label">Country: </label>
						<div class="col-sm-9">
							<select id="ccountry" name="country" class="form-control">
								<option value="">--- Please choose Country ---</option>
								<option value="Greece">Greece</option>
								<option value="Cyprus">Cyprus</option>	
                <option value="France">France</option>
                <option value="Germany">Germany</option>                
							</select>
						</div>
					</div>          
          
          <!-- Radio buttons with the same name allow only one selection. -->
          <div class="form-group">
		  
			      <label class="col-sm-3 control-label main-label">Gender: </label>
            <div class="col-sm-9">
			
              <label class="radio-inline">
                <input type="radio" name="gender" value="Male"> Male
              </label>
              <label class="radio-inline">
                <input type="radio" name="gender" value="Female"> Female
              </label>              
            </div>
		              
          </div>
          
          <!-- Checkboxes with the same name allow multiple selections.
               The servlet reads them with request.getParameterValues("skills"). -->
          <div class="form-group">
		  
			      <label class="col-sm-3 control-label main-label">Skills: </label>
            <div class="col-sm-9">
			
              <label class="checkbox-inline">
                <input type="checkbox" name="skills" value="Html"> Html
              </label>
              <label class="checkbox-inline">
                <input type="checkbox" name="skills" value="CSS"> CSS
              </label>
              <label class="checkbox-inline">
                <input type="checkbox" name="skills" value="Javascript"> Javascript
              </label>
              <label class="checkbox-inline">
                <input type="checkbox" name="skills" value="Java"> Java
              </label>
              <label class="checkbox-inline">
                <input type="checkbox" name="skills" value="JSP"> JSP
              </label>
              <label class="checkbox-inline">
                <input type="checkbox" name="skills" value="SQL"> SQL
              </label>
            </div>
		              
          </div>
          
          <!-- Submit sends the form, reset clears changes without sending a request. -->
          <div class="form-group">
            <div class="col-sm-9 col-sm-offset-3">
              <button type="submit" class="btn btn-success">
                <span class="glyphicon glyphicon-ok"></span> Save
              </button> 
              <button type="reset" class="btn btn-danger">
                <span class="glyphicon glyphicon-remove"></span> Cancel
              </button>              
            </div>
          </div>

        </form>

      </div><!-- /.container -->

      <!-- JavaScript files before the closing body tag -->
      <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
      <script src="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  </body>
</html>
